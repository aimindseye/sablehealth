name: Security
on:
  push:
    branches: [main]
  pull_request:
    # Include stacked feature-branch PRs, matching the owner's local review workflow.
  schedule:
    - cron: '30 6 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@0d579ffd059c29b07949a3cce3983f0780820c98
        with:
          languages: java-kotlin
          build-mode: manual
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - run: |
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager"
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Force Kotlin compilation for CodeQL extraction
        # Cached compileKotlin/compileDebugKotlin tasks produce no compiler trace.
        # Manual CodeQL requires actual builds after its init action; disabling
        # the build cache and rerunning tasks is intentional for this job only.
        run: |
          gradle --no-daemon --console=plain --no-build-cache --rerun-tasks :app:assembleDebug
      - uses: github/codeql-action/analyze@0d579ffd059c29b07949a3cce3983f0780820c98
  mobsf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Verify MobSF risk-gate implementation
        run: python3 -m unittest discover -s tests -p 'test_mobsf_policy.py' -v
      - name: Scan Android sources with MobSF
        id: mobsfscan
        uses: MobSF/mobsfscan@ec2927a8cfab6626a67f26b223be3aba52a34b70
        # Permit report collection, but the next step checks the actual scanner outcome.
        continue-on-error: true
        with:
          args: '. --sarif --output mobsfscan-results.sarif --type android'
      - name: Enforce baseline-aware MobSF risk gate
        env:
          MOBSF_SCAN_OUTCOME: ${{ steps.mobsfscan.outcome }}
        run: |
          python3 tools/check_mobsf_findings.py \
            --report mobsfscan-results.sarif \
            --baseline config/mobsf-known-findings.json \
            --scan-outcome "$MOBSF_SCAN_OUTCOME" \
            --summary "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobsfscan-sarif
          path: mobsfscan-results.sarif
          if-no-files-found: warn
      - if: always()
        uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98
        with:
          sarif_file: mobsfscan-results.sarif
