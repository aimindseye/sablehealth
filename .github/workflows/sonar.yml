name: SonarCloud (requires setup)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  analyze:
    # The repo owner must first configure the project and SONAR_TOKEN.
    if: vars.SONAR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: gradle --no-daemon :core:test :app:assembleDebug :app:lintDebug
      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccba0a872887e4f2015e5de2c445d933
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
