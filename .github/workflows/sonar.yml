name: SonarCloud mainline and PR quality

# First successful main push establishes the baseline for new-code comparisons.
# Do not skip when token is absent: missing setup is an actionable failure.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Kotlin/Python
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Full history for branch/new-code detection
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - name: Verify SonarCloud token presence
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo 'HOLD: SonarCloud token is absent'
            exit 2
          fi
      - name: Install Android SDK 36
        run: |
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager"
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build real coverage and Android lint inputs
        run: |
          gradle --no-daemon --console=plain :core:test :core:jacocoTestReport :app:assembleDebug :app:lintDebug
          test -s core/build/reports/jacoco/test/jacocoTestReport.xml
          test -s app/build/reports/lint-results-debug.xml
      - name: Analyze and enforce actual SonarCloud quality gate
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
      - name: Upload analysis input reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sablehealth-main-sonar-inputs
          path: |
            core/build/reports/jacoco/
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
