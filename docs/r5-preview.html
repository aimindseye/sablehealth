<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sable Health R5 · Daily Today / Compact Q25 prototype</title>
<style>
:root{font-family:Arial,system-ui,sans-serif;color-scheme:dark;--bg:#000;--surface:#141414;--raised:#262626;--fg:#fff;--muted:#a6a6a6;--blue:#2E9BD6;--green:#4ADE80;--amber:#FBBF24;--red:#E0463C}*{box-sizing:border-box}
body{margin:0;background:#080808;color:var(--fg)}.app{display:flex;flex-direction:column;height:100dvh;background:var(--bg)}
header{flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid #303030;min-height:48px}h1{font-size:18px;margin:0;font-weight:600}h2{font-size:16px;margin:0}.brand{flex:1;min-width:0}.sub{font-size:11px;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:4px}button{background:var(--surface);color:var(--fg);border:1px solid #444;border-radius:7px;font-size:12px;cursor:pointer;min-height:48px;padding:0 7px}button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}.selected{background:var(--blue);color:#000;font-weight:700;border-color:var(--blue)}.actions button{border-color:var(--blue)}main{overflow-y:auto;min-height:0;flex:1;padding:5px 8px}.heading{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}.desc{font-size:11px;color:var(--muted);white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}.modes{display:flex;gap:2px}.modes button{min-width:46px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:6px 0}.metric,.graph,.notice{background:var(--surface);border-radius:9px;padding:9px;margin-bottom:6px}.metric{min-height:73px;margin-bottom:0}.metric .k{font-size:11px;color:var(--muted)}.metric strong{display:block;font-size:19px;color:var(--blue);margin:3px 0}.metric .d{font-size:11px}.graph{padding:8px 9px}.graph .head{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:9px}.demo{color:var(--blue);font-size:10px}.barline{display:flex;width:100%;gap:0;height:13px;background:var(--raised);border-radius:6px;overflow:hidden}.barline span{height:100%;display:block}.goal{background:var(--blue)}.sleepa{background:var(--blue)}.sleepb{background:#69BFD9}.sleepc{background:#a6a6a6}.legend{font-size:10px;color:var(--muted);margin-top:6px}.notice{font-size:12px;color:var(--muted);border:1px solid #3b3b3b}footer{display:flex;flex:none;gap:2px;padding:0 2px;border-top:1px solid #3b3b3b}footer button{flex:1;min-width:0;padding:0 1px;font-size:12px}.history{height:51px;display:flex;align-items:end;gap:8px;justify-content:space-around;border-bottom:1px solid #666;margin-top:5px}.history span{width:12%;border-radius:4px 4px 0 0}.daylabels{display:flex;justify-content:space-around;font-size:10px;color:var(--muted);padding-top:4px}.linegraph{height:35px;width:100%}.linegraph polyline{fill:none;stroke:var(--blue);stroke-width:2}.linegraph circle{fill:var(--blue)}.small{font-size:11px;color:var(--muted);margin:6px 0}.below{color:var(--amber)}.win{color:var(--green)}.outlier{color:var(--red)}.hide{display:none!important}
@media (min-width:560px){header{padding:5px 10px}main{padding:8px 10px}footer{padding:3px 5px}h1{font-size:21px}.metric{min-height:84px}}
</style></head><body>
<div class="app"><header><div class="brand"><h1>Sable Health</h1><div class="sub" id="devlabel">DEMO DATA · Zinwa Q25</div></div><div class="actions"><button>Sources</button><button>Settings</button></div></header><main><div class="heading"><div><h2 id="heading">Today</h2><div class="desc" id="desc">Current-day snapshot only</div></div><div class="modes"><button id="text" class="selected">Text</button><button id="graphs">Graphs</button></div></div><div id="content"></div></main><footer id="tabs"></footer></div>
<script>
let tab='Today',mode='Text';let device='Q25';if(new URLSearchParams(location.search).get('device')==='titan2'){device='Titan 2';document.getElementById('devlabel').textContent='DEMO DATA · Unihertz Titan 2'}
const tabs=['Today','Sleep','Move','Vitals','Trends'];const el=(id)=>document.getElementById(id);
const metrics=(items)=>`<div class="grid">${items.map(a=>`<div class="metric"><div class="k">${a[0]}</div><strong>${a[1]}</strong><div class="d">${a[2]}</div></div>`).join('')}</div>`;
const metricsToday=[['STEPS','7,420','Goal 9,000 · Demo'],['LAST NIGHT','7h 42m','Sleep · Demo'],['RESTING HR','61 bpm','Measured · Demo'],['HRV','43 ms','Overnight · Demo']];
const progress=`<section class="graph"><div class="head">Today · step goal <span class="demo">DEMO</span></div><div style="font-size:12px;margin-bottom:6px">7,420 of 9,000 steps · 82%</div><div class="barline"><span class="goal" style="width:82.4%"></span></div><div class="legend">Goal progress, not a medical assessment</div></section>`;
const sleep=`<section class="graph"><div class="head">Last night · sleep stages <span class="demo">DEMO</span></div><div class="barline"><span class="sleepa" style="width:18.2%"></span><span class="sleepb" style="width:23.4%"></span><span class="sleepc" style="width:58.4%"></span></div><div class="legend">Deep 1h24 · REM 1h48 · Light 4h30</div></section>`;
const weekly=`<section class="graph"><div class="head">Steps · last 7 days <span class="demo">DEMO</span></div><div class="history">${[['46%','var(--red)'],['76%','var(--blue)'],['100%','var(--green)'],['81%','var(--blue)'],['78%','var(--blue)'],['65%','var(--amber)'],['81%','var(--blue)']].map(x=>`<span style="height:${x[0]};background:${x[1]}"></span>`).join('')}</div><div class="daylabels"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="legend">Blue: info · Green: goal · Amber: below plan · Red: demo outlier</div></section>`;
const hr=`<section class="graph"><div class="head">Resting HR · last 7 days <span class="demo">DEMO</span></div><svg class="linegraph" viewBox="0 0 300 35" preserveAspectRatio="none"><polyline points="7,13 55,8 103,17 151,23 199,17 247,29 293,23"/><circle cx="7" cy="13" r="3"/><circle cx="55" cy="8" r="3"/><circle cx="103" cy="17" r="3"/><circle cx="151" cy="23" r="3"/><circle cx="199" cy="17" r="3"/><circle cx="247" cy="29" r="3"/><circle cx="293" cy="23" r="3"/></svg><div class="daylabels"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="legend">No personal baseline established in M0</div></section>`;
const views={Today:{Text:metrics(metricsToday)+`<div class="small">Baseline: finding your usual · no recovery score</div><div class="notice">Source: Available · no records queried</div>`,Graphs:progress+sleep+`<div class="small">Today displays no 7-day trends</div>`},Sleep:{Text:metrics([['TIME ASLEEP','7h 42m','Last night'],['DEEP','1h 24m','Demo'],['REM','1h 48m','Demo'],['LIGHT','4h 30m','Demo']]),Graphs:metrics([['TIME ASLEEP','7h 42m','Demo'],['DEEP','1h 24m','Demo']])+sleep},Move:{Text:metrics([['STEPS','7,420','Goal 9,000'],['ACTIVE','42 min','Demo'],['DISTANCE','5.4 km','Demo']]),Graphs:metrics([['STEPS','7,420','Goal 9,000'],['ACTIVE','42 min','Demo']])+weekly},Vitals:{Text:metrics([['HEART RATE','74 bpm','Demo'],['RESTING HR','61 bpm','Demo'],['HRV','43 ms','Demo'],['SpO2','—','Not available']]),Graphs:metrics([['HEART RATE','74 bpm','Demo'],['RESTING HR','61 bpm','Demo']])+hr},Trends:{Text:metrics([['STEPS','7 days','Synthetic history'],['RESTING HR','7 days','Synthetic history']]),Graphs:weekly+hr}};
function render(){el('heading').textContent=tab;el('desc').textContent=tab==='Today'?'Current-day snapshot only':tab==='Trends'?'Historical comparisons':tab==='Move'?'Daily activity and seven-day steps':'Measurements and history';el('content').innerHTML=views[tab][mode];el('text').classList.toggle('selected',mode==='Text');el('graphs').classList.toggle('selected',mode==='Graphs');el('tabs').innerHTML=tabs.map(t=>`<button class="${tab===t?'selected':''}" data-tab="${t}">${t}</button>`).join('');}
const preference={Today:'Text',Sleep:'Graphs',Move:'Graphs',Vitals:'Graphs',Trends:'Graphs'};
function switchTab(t){tab=t;mode=preference[t];render()};function switchMode(m){mode=m;preference[tab]=m;render()}
el('text').onclick=()=>switchMode('Text');el('graphs').onclick=()=>switchMode('Graphs');el('tabs').onclick=e=>{if(e.target.dataset.tab)switchTab(e.target.dataset.tab)};document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='t'){switchTab(tabs[(tabs.indexOf(tab)+1)%tabs.length])}});render();
</script></body></html>
