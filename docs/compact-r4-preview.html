<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sable Health — Compact R4 Concept</title>
<style>
:root{--blue:#2e9bd6;--text:#fff;--muted:#a6a6a6;--bg:#000;--card:#141414;--raised:#262626;--line:#343434;--secondary:#5aaedb}
body.light{--blue:#1a6fa0;--text:#12171c;--muted:#515b66;--bg:#f5f7f9;--card:#fff;--raised:#e9edf2;--line:#cbd5df;--secondary:#6aaed0}
*{box-sizing:border-box}body{margin:0;background:#10141b;color:#fff;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.controls{margin:20px auto 14px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.controls label{font-size:12px;color:#a6b0be}
.controls button{background:#202630;border:1px solid #44505d;color:#fff;border-radius:7px;padding:9px 12px;cursor:pointer}
.controls button.selected{border-color:#2e9bd6;color:#64cbff}
.viewport{margin:auto;width:411px;max-width:96vw;height:411px;border:1px solid #434a52;background:var(--bg);color:var(--text);display:flex;flex-direction:column;border-radius:12px;overflow:hidden;box-shadow:0 12px 40px #0009}
.header{display:flex;align-items:center;gap:5px;padding:4px 10px;min-height:56px;border-bottom:1px solid var(--line)}
.header .brand{min-width:0;flex:1}.brand strong{display:block;font-size:19px;white-space:nowrap}.brand small{color:var(--blue);font-size:11px;white-space:nowrap}
.action{border:1px solid var(--blue);background:transparent;color:var(--text);min-height:48px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:600}
.main{min-height:0;flex:1;overflow:auto;padding:7px 10px;scrollbar-width:thin}.title{font-size:17px;font-weight:650;line-height:21px}.sub{color:var(--muted);font-size:11px;margin:2px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px}.metric{min-width:0;background:var(--card);border-radius:10px;padding:7px 10px;min-height:67px}.metric b{font-size:10px;font-weight:600;color:var(--muted);display:block;white-space:nowrap}.metric strong{font-size:17px;font-weight:700;display:block;color:var(--blue);margin:2px 0}.metric small{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{margin-top:7px;background:var(--card);border-radius:10px;padding:8px 10px}.charttitle{display:flex;justify-content:space-between;font-size:12px;font-weight:600;align-items:center;margin-bottom:5px}.demo{font-size:10px;color:var(--blue);font-weight:700}
svg{width:100%;height:54px;display:block}.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.legend{display:flex;gap:10px;align-items:center;justify-content:space-between;color:var(--text);font-size:11px}.dot{width:9px;height:9px;display:inline-block;margin-right:3px;border-radius:2px;vertical-align:middle}
.stage{display:flex;height:17px;border-radius:6px;overflow:hidden;margin:7px 0 10px}.stage div:nth-child(1){background:var(--blue);flex:84}.stage div:nth-child(2){background:var(--blue);opacity:.60;flex:108}.stage div:nth-child(3){background:var(--muted);opacity:.45;flex:270}
.nav{border-top:1px solid var(--line);display:flex;gap:3px;padding:2px 4px;min-height:53px}.nav button{min-width:0;flex:1;min-height:48px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:6px;font-size:12px;font-weight:650;cursor:pointer;padding:0}.nav button.current{color:var(--blue);background:var(--raised);border-color:var(--blue)}
.foot{margin:14px auto 20px;max-width:470px;text-align:center;font-size:12px;line-height:1.5;color:#9da8b6}.swatch{display:inline-block;height:13px;width:13px;border:1px solid #9995;border-radius:3px;vertical-align:middle;margin-right:3px}button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style></head><body>
<div class="controls"><label>Demo screen</label><button data-tab="Sleep" class="selected">Sleep</button><button data-tab="Move">Move</button><button data-tab="Vitals">Vitals</button><button data-tab="Trends">Trends</button><button id="theme">Dark / Light</button></div>
<div class="viewport" role="region" aria-label="Sable Health compact screen demo">
<div class="header"><div class="brand"><strong>Sable Health</strong><small>DEMO DATA · Zinwa Q25</small></div><button class="action">Sources</button><button class="action">Settings</button></div>
<div class="main"><div id="screen"></div></div>
<div class="nav"><button>Today</button><button class="current">Sleep</button><button>Move</button><button>Vitals</button><button>Trends</button></div>
</div>
<p class="foot">M0 UI proposal · All metrics and chart points are synthetic. <span class="swatch" style="background:#2E9BD6"></span>Sable Blue #2E9BD6 · <span class="swatch" style="background:#1A6FA0"></span>Light accent #1A6FA0. Neutral gray represents secondary data, not a clinical threshold. <strong>This is a browser mockup, not an Android screenshot.</strong></p>
<script>
const sample={Sleep:[['TIME ASLEEP','7h 42m','11:15 PM–7:18 AM'],['DEEP SLEEP','1h 24m','Synthetic stage'],['REM','1h 48m','Synthetic stage'],['LIGHT SLEEP','4h 30m','Synthetic stage']],Move:[['STEPS','7,420','Goal 9,000 · Demo'],['ACTIVE','42 min','Synthetic activity'],['DISTANCE','5.4 km','Synthetic walk']],Vitals:[['HEART RATE','74 bpm','Synthetic sample'],['RESTING HR','61 bpm','Synthetic daily avg'],['HRV','43 ms','Synthetic night'],['SPO2','—','Not available']]};
const days=['M','T','W','T','F','S','S'];let tab='Sleep';const steps=[5900,7900,6600,8700,7200,8200,7420],heart=[63,64,62,61,62,60,61];
function bar(){const max=9000,slot=48;let parts=steps.map((n,i)=>{const h=(n/max*47).toFixed(1),x=20+i*slot;return `<rect x="${x}" y="${54-h}" width="25" height="${h}" rx="3" fill="var(--blue)" opacity="${i===6?1:.52}"/>`}).join('');return `<div class="chart"><div class="charttitle">Steps · last 7 days <span class="demo">DEMO</span></div><svg viewBox="0 0 360 54" preserveAspectRatio="none" aria-label="Synthetic seven-day steps bar chart"><line x1="0" x2="360" y1="27" y2="27" stroke="var(--line)"/>${parts}</svg><div class="axis">${days.map(d=>`<span>${d}</span>`).join('')}</div></div>`}
function line(){const pts=heart.map((n,i)=>[12+i*56,10+(65-n)/6*30]);const path=pts.map(([x,y],i)=>`${i?'L':'M'}${x} ${y}`).join(' ');return `<div class="chart"><div class="charttitle">Resting heart rate · 7 days <span class="demo">DEMO</span></div><svg viewBox="0 0 360 54" preserveAspectRatio="none" aria-label="Synthetic seven-day resting heart rate line chart"><line x1="0" x2="360" y1="28" y2="28" stroke="var(--line)"/><path d="${path}" fill="none" stroke="var(--blue)" stroke-width="2.6"/>${pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="${i===6?4:2.6}" fill="var(--blue)"/>`).join('')}</svg><div class="axis">${days.map(d=>`<span>${d}</span>`).join('')}</div></div>`}
function stages(){return `<div class="chart"><div class="charttitle">Last night · sleep stages <span class="demo">DEMO</span></div><div class="stage" aria-label="Synthetic sleep stages: deep 84 min, REM 108 min, light 270 min"><div></div><div></div><div></div></div><div class="legend"><span><span class="dot" style="background:var(--blue)"></span>Deep 1h24</span><span><span class="dot" style="background:var(--blue);opacity:.6"></span>REM 1h48</span><span><span class="dot" style="background:var(--muted);opacity:.5"></span>Light 4h30</span></div></div>`}
function render(){const subtitles={Sleep:'Last night · sleep sessions and stages',Move:'Daily activity and movement',Vitals:'Recorded values, not diagnoses',Trends:'Last seven days · synthetic examples'};let out=`<div class="title">${tab}</div><div class="sub">${subtitles[tab]}</div>`;if(sample[tab])out+=`<div class="metrics">${sample[tab].map(m=>`<div class="metric"><b>${m[0]}</b><strong>${m[1]}</strong><small>${m[2]}</small></div>`).join('')}</div>`;out+=tab==='Sleep'?stages():tab==='Move'?bar():tab==='Vitals'?line():bar()+line();document.querySelector('#screen').innerHTML=out;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('selected',b.dataset.tab===tab));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('current',b.textContent===tab));}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{if(['Sleep','Move','Vitals','Trends'].includes(b.textContent)){tab=b.textContent;render()}});
document.querySelector('#theme').onclick=()=>document.body.classList.toggle('light');render();
</script></body></html>
