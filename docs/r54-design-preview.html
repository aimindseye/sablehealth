<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sable Health · Sources & Settings UX proposal</title>
<style>
:root{--accent:#2E9BD6;--accent2:#75d4ee;--bg:#000;--surface:#141414;--raised:#252629;--stroke:#454951;--muted:#b9c0c8;--fg:#fff;--green:#69d99b;--amber:#ffd078;--red:#e96a68;--focus:var(--accent)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,"Source Sans 3",system-ui,sans-serif;background:#121724;color:#fff}
body.light{--bg:#F5F7F9;--surface:#fff;--raised:#E9EDF2;--stroke:#cdd3d9;--muted:#515B66;--fg:#12171C;--accent:#1A6FA0;--accent2:#256d92;--green:#237c55;--amber:#a7650c;--red:#bc4850;--focus:#1A6FA0}
body.light{color:var(--fg)}
.ui-shell{margin:auto;max-width:1280px;padding:18px 20px 50px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;max-width:1050px;margin:0 auto 14px;color:#eceff4}
.toolbar strong{font-size:15px}.toolbar small{font-size:12px;color:#b7beca}
.toolbar button,.toolbar select{border:1px solid #656f80;background:#1b2738;color:#ecf6ff;border-radius:8px;padding:8px 10px;font-size:12px;cursor:pointer}
.toolbar .controls{display:flex;gap:7px;flex-wrap:wrap}
.review-layout{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;align-items:flex-start}
.phone-frame{padding:10px;background:#2b3037;border:2px solid #535a67;border-radius:21px;box-shadow:0 24px 60px #05070a80;width:434px;max-width:100%;flex-shrink:0}
.phone{width:411px;max-width:100%;height:411px;overflow:hidden;background:var(--bg);color:var(--fg);position:relative;border-radius:8px}
.status{height:23px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;color:var(--muted);font-size:11px;letter-spacing:.1px}
.status b{color:var(--fg);font-weight:700}
.status-icons{display:flex;gap:7px;align-items:center}
.battery{width:18px;height:9px;border:1px solid var(--muted);border-radius:2px;position:relative}
.battery:after{content:"";position:absolute;top:1px;left:1px;width:13px;height:5px;border-radius:1px;background:var(--green)}
.header{height:55px;border-bottom:1px solid var(--stroke);padding:0 9px;display:flex;gap:5px;align-items:center}
.brand{min-width:0;flex:1;display:flex;gap:7px;align-items:center}
.brand-mark{width:42px;height:48px;flex:0 0 42px;background:transparent;border:0;display:flex;align-items:center;justify-content:center;color:var(--accent);cursor:pointer}.brand-mark svg{border:1px solid var(--accent);border-radius:7px;padding:3px;width:28px;height:28px!important}
.brand-mark svg{height:19px;width:19px;stroke-width:2.2}
.brand-text{min-width:0}
.brand-name{font-weight:750;font-size:15px;line-height:17px;white-space:nowrap;letter-spacing:-.25px}
.brand-sub{font-weight:600;font-size:9.5px;letter-spacing:.3px;color:var(--accent);white-space:nowrap}
.header-action{font-size:11px;font-weight:700;border:1px solid var(--accent);border-radius:7px;height:35px;min-width:68px;padding:0 6px;color:var(--fg);background:var(--surface);white-space:nowrap;cursor:pointer}
.header-action.selected{background:#124763;color:#e5faff}
body.light .header-action.selected{background:#d9edf8;color:#164e70}
.header-action:focus-visible,.tile:focus-visible,.wide-row:focus-visible,.mini-button:focus-visible,.seg button:focus-visible,.button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.content{height:333px;overflow:auto;overscroll-behavior:contain;padding:9px 10px 12px;scrollbar-width:thin;scrollbar-color:#316c83 transparent}
.page-heading{display:flex;justify-content:space-between;align-items:center;gap:6px;height:19px;margin-bottom:0px}
.page-heading b{font-size:16px;letter-spacing:-.25px}
.scope{color:var(--accent);font-size:9px;border:1px solid var(--accent);border-radius:99px;padding:3px 6px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:5px}
.tile{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--stroke);border-radius:11px;padding:7px 9px;text-align:left;color:var(--fg);width:100%;cursor:pointer}
.tile .i{height:31px;width:31px;flex:0 0 31px;display:flex;align-items:center;justify-content:center;background:var(--raised);border-radius:8px;color:var(--accent)}
.tile .i svg{width:21px;height:21px}
.tile-main{flex:1;min-width:0}.tile-title{font-size:13px;font-weight:750;line-height:16px}.tile-desc{color:var(--muted);font-size:10.5px;line-height:14px;margin-top:3px}.tile-extra{font-size:10.5px;color:var(--green);font-weight:700;margin-top:2px}
.tile-extra.warn{color:var(--amber)}.chevron{font-size:19px;color:var(--muted);padding-right:1px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stat{background:var(--surface);border:1px solid var(--stroke);padding:7px 10px;border-radius:10px;min-height:48px}
.stat-label{font-size:10px;color:var(--muted);display:flex;gap:4px;align-items:center}
.stat-label svg{width:13px;height:13px;flex:0 0 13px;color:var(--accent)}
.stat-value{font-size:15px;color:var(--fg);font-weight:700;line-height:19px;margin-top:3px}
.stat-value em{font-style:normal;color:var(--accent)}
.wide-row{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--fg);background:var(--surface);border:1px solid var(--stroke);border-radius:10px;text-align:left;padding:8px 10px;min-height:42px;width:100%;cursor:pointer}
.wide-title{font-size:12px;font-weight:700}.wide-sub{font-size:10px;color:var(--muted);margin-top:2px}.right{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--accent);font-weight:650;text-align:right;white-space:nowrap}.detail-text{font-size:11px;color:var(--muted);line-height:16px}
.buttons{display:flex;gap:7px}.button{background:#143f56;color:#bceeff;border:1px solid var(--accent);border-radius:9px;min-height:40px;flex:1;font-size:12px;font-weight:700;cursor:pointer}
.button.ghost{background:var(--surface);color:var(--fg);border-color:var(--stroke)}
.group{background:var(--surface);border:1px solid var(--stroke);border-radius:11px;padding:7px 9px}
.group-top{display:flex;align-items:center;gap:7px;margin-bottom:7px}.group-title{font-size:11.5px;font-weight:750;color:var(--fg)}.group-top svg{width:17px;height:17px;color:var(--accent)}
.group-inner{padding:0 2px}
.group .wide-row{border:none;background:var(--raised);border-radius:8px;padding:7px 9px;min-height:37px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--raised);padding:3px;border-radius:8px;border:1px solid var(--stroke)}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{cursor:pointer;background:transparent;border:0;color:var(--muted);font-size:10.5px;font-weight:700;border-radius:6px;min-height:30px;padding:0 3px}
.seg button.active{color:#071c28;background:var(--accent)}
body.light .seg button.active{color:#fff}
.note{font-size:10.5px;color:var(--muted);line-height:1.4}
.note strong{color:var(--accent)}
.section-rule{font-size:10px;font-weight:750;color:var(--accent);letter-spacing:.4px;text-transform:uppercase;margin:2px 0 -3px}
.selectedline{border-left:3px solid var(--accent);padding-left:9px;background:var(--raised);border-radius:0 6px 6px 0;padding-top:8px;padding-bottom:8px}
.small{font-size:10px;color:var(--muted)}
.flexend{margin-left:auto}.two-line{display:flex;flex-direction:column;gap:1px}
.previewlabel{font-size:13px;font-weight:700;margin-top:9px;text-align:center;color:#d9e5f1}
.hidden{display:none!important}
/* Preserve 48dp hit target via separate transparent button padding in production; browser review uses compact visible surfaces. */
@media (max-width:500px){.ui-shell{padding:0}.toolbar{padding:9px 12px}.review-layout{gap:0}.phone-frame{width:100%;max-width:411px;border:0;border-radius:0;padding:0;background:transparent;box-shadow:none}.phone{border-radius:0}.previewlabel{display:none}}
</style></head>
<body>
<div class="ui-shell">
<div class="toolbar"><div><strong>Sable Health · Sources & Settings design review</strong><br><small>Concept only · Q25 411dp square viewport · no Health Connect reads</small></div>
<div class="controls"><button id="sourcesTop">Sources</button><button id="settingsTop">Settings</button><button id="deviceTop">Device settings</button><button id="widgetsTop">Widget picker</button><button id="themeToggle">Theme: Dark</button></div></div>
<div class="review-layout"><div class="phone-frame"><div class="phone" id="phone">
<div class="status"><span><b>4:06</b> ◉ ▴</span><span class="status-icons"><span>▥ ▰</span><span class="battery"></span></span></div>
<div class="header"><div class="brand"><button class="brand-mark" onclick="go('dashboard')" aria-label="Back to Dashboard" title="Back to Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><div class="brand-text"><div class="brand-name">Sable Health</div><div id="brandSubtitle" class="brand-sub">SOURCES · ZINWA Q25</div></div></div><button class="header-action selected" id="sourceBtn" onclick="go('sources')">Sources</button><button class="header-action" id="settingsBtn" onclick="go('settings')">Settings</button></div>
<main class="content" id="content" aria-label="Sable Health design preview"></main>
</div><div class="previewlabel" id="previewLabel">Sources · Q25 compact design</div></div></div></div>
<script>
const icons={
 link:'<path d="M10 13a5 5 0 0 0 7.54.53l3-3a5 5 0 1 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.53l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
 heart:'<path d="M12 21s-9-5.6-9-11.5a5.5 5.5 0 0 1 9-4 5.5 5.5 0 0 1 9 4C21 15.4 12 21 12 21Z"/><path d="M3 12h4l2-3 3 6 2-3h7"/>',
 boxes:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
 palette:'<circle cx="12" cy="12" r="9"/><circle cx="7.5" cy="10" r="1"/><circle cx="10" cy="6.5" r="1"/><circle cx="15" cy="7" r="1"/><path d="M13 21c-1.5-3 2-3.5 2-6 0-1.5-2.1-2.6-3.4-1.1"/>',
 database:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/>',
 shield:'<path d="M12 2 4 6v5c0 5.7 3.5 9 8 11 4.5-2 8-5.3 8-11V6l-8-4Z"/><path d="m9 12 2 2 4-4"/>',
 phone:'<rect x="5" y="2" width="14" height="20" rx="3"/><path d="M10 18h4"/>',
 keyboard:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M10 13h.01M14 13h.01M18 13h.01M7 16h10"/>',
 info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v6M12 7h.01"/>',
 refresh:'<path d="M20 6v5h-5M4 18v-5h5"/><path d="M5 9a8 8 0 0 1 14-3l1 5M4 13l1 5a8 8 0 0 0 14-3"/>',
 lock:'<rect x="5" y="11" width="14" height="11" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'
};
function ico(k){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[k]||icons.info}</svg>`}
let page='sources',appearance='System',dataMode='Demo',privacy=false,selectedWidgets=['Steps','Heart rate','Sleep stages','HRV'],sourceChecked=false,profile='Automatic (Zinwa Q25)';
const statusLabel='Available',pairedLabel='Paired & synced · user confirmed';
function go(name){page=name;document.getElementById('brandSubtitle').textContent=(name==='sources'?'SOURCES':name==='settings'?'SETTINGS':name==='device'?'PHONE & INPUT':name==='widgets'?'DASHBOARD WIDGETS':name==='privacy'?'PRIVACY':'SOURCE DETAIL')+' · ZINWA Q25';document.getElementById('sourceBtn').classList.toggle('selected',name==='sources'||name==='source-detail');document.getElementById('settingsBtn').classList.toggle('selected',name==='settings'||name==='device'||name==='widgets'||name==='privacy');document.getElementById('previewLabel').textContent=name.charAt(0).toUpperCase()+name.slice(1)+' · Q25 compact design';document.getElementById('content').scrollTop=0;render()}
function render(){document.getElementById('content').innerHTML=views[page]();}
const views={
 dashboard:()=>`<div class="page-heading"><b>Dashboard</b><span class="scope">DESIGN PREVIEW</span></div><div class="stack"><div class="tile"><div class="tile-main"><div class="tile-title">Daily snapshot</div><div class="tile-desc">Your existing four-widget Dashboard is unchanged.</div></div></div><div class="pair"><div class="stat"><div class="stat-label">Steps · Demo</div><div class="stat-value">7,420</div></div><div class="stat"><div class="stat-label">Heart rate · Demo</div><div class="stat-value">74 bpm</div></div></div><button class="button" onclick="go('sources')">Sources</button><button class="button ghost" onclick="go('settings')">Settings</button></div>`,
 sources:()=>`<div class="page-heading"><b>Data connections</b><span class="scope">M0 · DIAGNOSTIC</span></div><div class="stack">
 <button class="tile" onclick="go('source-detail')"><span class="i">${ico('link')}</span><span class="tile-main"><div class="tile-title">Health Connect</div><div class="tile-extra">● Available</div><div class="tile-desc">Read access not requested · M0</div></span><span class="chevron">›</span></button>
 <button class="tile" onclick="go('source-detail')"><span class="i">${ico('heart')}</span><span class="tile-main"><div class="tile-title">Google Health · Fitbit Air</div><div class="tile-extra">${pairedLabel}</div><div class="tile-desc">Health Connect export not verified</div></span><span class="chevron">›</span></button>
 <div class="pair"><div class="stat"><div class="stat-label">${ico('shield')} Permissions</div><div class="stat-value">0 <em>granted</em></div></div><div class="stat"><div class="stat-label">${ico('database')} Records imported</div><div class="stat-value">None</div></div></div>
 <button class="wide-row" onclick="go('privacy')"><span><div class="wide-title">Privacy & diagnostics</div><div class="wide-sub">Local-only · no Fitbit BLE connection</div></span><span class="chevron">›</span></button>
 <div class="buttons"><button class="button" onclick="sourceChecked=true;render()">${sourceChecked?'Availability rechecked':'⟳  Check availability again'}</button></div>
 </div>`,
 'source-detail':()=>`<div class="page-heading"><b>Health Connect details</b><span class="scope">READ-ONLY</span></div><div class="stack">
 <div class="tile"><span class="i">${ico('link')}</span><div class="tile-main"><div class="tile-title">Health Connect: Available</div><div class="tile-desc">Platform detected on this phone</div></div></div>
 <div class="pair"><div class="stat"><div class="stat-label">Metric access</div><div class="stat-value">Not requested</div></div><div class="stat"><div class="stat-label">Imported records</div><div class="stat-value">None</div></div></div>
 <div class="group"><div class="group-title">Fitbit Air data pathway</div><p class="detail-text">Your Fitbit Air is paired and synced in Google Health. Sable Health M0 has not read Health Connect records or verified that Google Health exports the measurements you need.</p></div>
 <div class="group"><div class="group-title">M1 verification</div><p class="detail-text">Once implemented: request read-only permissions, inspect record types and timestamps, and display actual source coverage before enabling metric widgets.</p></div>
 <button class="button ghost" onclick="go('sources')">‹ Back to Sources</button></div>`,
 settings:()=>`<div class="page-heading"><b>Customize your experience</b><span class="scope">LOCAL</span></div><div class="stack">
 <section class="group"><div class="group-top">${ico('boxes')}<div class="group-title">Dashboard</div></div><button class="wide-row" onclick="go('widgets')"><span class="wide-title">Customize widgets</span><span class="right">4 selected <span class="chevron">›</span></span></button></section>
 <section class="group"><div class="group-top">${ico('palette')}<div class="group-title">Appearance</div></div><div class="seg">${['System','Light','Dark'].map(v=>`<button class="${appearance===v?'active':''}" onclick="appearance='${v}';document.body.classList.toggle('light',appearance==='Light');render()">${v}</button>`).join('')}</div></section>
 <section class="group"><div class="group-top">${ico('database')}<div class="group-title">Data mode</div></div><div class="seg two">${['Demo','No records'].map(v=>`<button class="${dataMode===v?'active':''}" onclick="dataMode='${v}';render()">${v}</button>`).join('')}</div></section>
 <button class="wide-row" onclick="go('device')"><span><div class="wide-title">Phone, input & privacy</div><div class="wide-sub">Zinwa Q25 · local-only</div></span><span class="chevron">›</span></button>
 </div>`,
 device:()=>`<div class="page-heading"><b>Phone & keyboard</b><span class="scope">Q25</span></div><div class="stack">
 <div class="group"><div class="group-top">${ico('phone')}<div class="group-title">Device profile</div></div><div class="small">Detected: Zinwa Q25 · Selected: ${profile}</div></div>
 <button class="wide-row" onclick="profile='Automatic (Zinwa Q25)';render()"><span class="wide-title">Automatic detection</span><span class="right">${profile.startsWith('Automatic')?'● Selected':'Select'}</span></button>
 <button class="wide-row" onclick="profile='Zinwa Q25';render()"><span class="wide-title">Zinwa Q25</span><span class="right">${profile==='Zinwa Q25'?'● Selected':'Select'}</span></button>
 <button class="wide-row" onclick="profile='Unihertz Titan 2';render()"><span class="wide-title">Unihertz Titan 2</span><span class="right">${profile==='Unihertz Titan 2'?'● Selected':'Select'}</span></button>
 <button class="wide-row" onclick="profile='Zinwa P26';render()"><span class="wide-title">Zinwa P26</span><span class="right">${profile==='Zinwa P26'?'● Selected':'Select'}</span></button>
 <div class="group"><div class="group-top">${ico('keyboard')}<div class="group-title">Keyboard controls</div></div><div class="detail-text">Q25: trackpad / DPAD to move, click / Enter to select, Back to return. Custom keymap editor is planned, not yet available.</div></div>
 <button class="wide-row" onclick="go('privacy')"><span><div class="wide-title">Privacy & diagnostics</div><div class="wide-sub">No telemetry, network sync or direct Fitbit BLE</div></span><span class="chevron">›</span></button>
 <button class="button ghost" onclick="go('settings')">‹ Back to Settings</button>
 </div>`,
 widgets:()=>`<div class="page-heading"><b>Dashboard widgets</b><span class="scope">4 SLOTS</span></div><div class="stack">
 <p class="note">Choose exactly four widgets; select text or graph where supported. Preferences stay on this phone.</p>
 ${selectedWidgets.map((w,i)=>`<button class="wide-row" onclick="void(0)"><span><div class="wide-title">${i+1}. ${w}</div><div class="wide-sub">${i<2?'Hero card':i===2?'Wide visual tile':'Compact tile'}</div></span><span class="right">${i===2?'Graph':'Text / Graph'} <span class="chevron">›</span></span></button>`).join('')}
 <div class="buttons"><button class="button ghost" onclick="selectedWidgets=['Steps','Heart rate','Sleep stages','HRV'];render()">Reset</button><button class="button" onclick="go('settings')">Save & return</button></div>
 <p class="note">Additional metrics (SpO₂, temperature, cardio fitness, recovery) remain conditional until their export and sufficient history are verified.</p>
 </div>`,
 privacy:()=>`<div class="page-heading"><b>Privacy & diagnostics</b><span class="scope">LOCAL</span></div><div class="stack">
 <div class="tile"><span class="i">${ico('lock')}</span><span class="tile-main"><div class="tile-title">Privacy first</div><div class="tile-desc">No backend, account, analytics, remote sync or direct Fitbit Bluetooth connection in M0</div></span></div>
 <div class="group"><div class="group-title">Sources explained</div><p class="detail-text">Available means the Health Connect service is installed; it does not mean records are readable. An imported-record count of None is not the same as zero steps.</p></div>
 <div class="group"><div class="group-title">Permissions</div><p class="detail-text">M0 has no health metric read permissions. M1 will ask only for selected data types, and show precisely which types are accessible.</p></div>
 <button class="button ghost" onclick="go('sources')">‹ Back to Sources</button>
 </div>`
};
function theme(){document.body.classList.toggle('light');appearance=document.body.classList.contains('light')?'Light':'Dark';document.getElementById('themeToggle').textContent='Theme: '+appearance;render()}
document.getElementById('sourcesTop').onclick=()=>go('sources');document.getElementById('settingsTop').onclick=()=>go('settings');document.getElementById('deviceTop').onclick=()=>go('device');document.getElementById('widgetsTop').onclick=()=>go('widgets');document.getElementById('themeToggle').onclick=theme;
document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'){if(page==='source-detail'||page==='privacy')go('sources');else if(page==='device'||page==='widgets')go('settings');else go('sources');e.preventDefault()} });
window.previewGo=go;render();
</script></body></html>
