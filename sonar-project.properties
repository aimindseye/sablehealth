# Sable Health: CI-based SonarQube Cloud, user must create project and SONAR_TOKEN.
# Expected default Sonar organization/key (verify with actual SonarCloud project).
sonar.organization=aimindseye
sonar.projectKey=aimindseye_sablehealth
sonar.projectName=Sable Health

sonar.sources=app/src/main,core/src/main,tools
sonar.tests=core/src/test,tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.exclusions=**/build/**,**/.gradle/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.webp,**/*.ico,**/*.ttf,**/*.pdf,**/gradle/wrapper/**

# Do not blanket-exclude Android source just to manufacture a green coverage gate.
# JVM core coverage is measured from actual Jacoco XML; Android UI/platform
# instrumentation remains a separate coverage gap until device/UI tests exist.
sonar.coverage.jacoco.xmlReportPaths=core/build/reports/jacoco/test/jacocoTestReport.xml
sonar.androidLint.reportPaths=app/build/reports/lint-results-debug.xml
