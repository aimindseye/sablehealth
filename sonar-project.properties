# SonarQube Cloud mainline bootstrap for aimindseye/sablehealth.
# Project and SONAR_TOKEN were configured by the repository owner.
# Mainline baseline must be analyzed before interpreting PR new-code coverage.
sonar.projectKey=aimindseye_sablehealth
sonar.organization=aimindseye
sonar.projectName=Sable Health
sonar.sourceEncoding=UTF-8

# Explicit, disjoint source and test scope; retain all non-test source analysis.
sonar.sources=.
sonar.tests=core/src/test,app/src/test,app/src/androidTest,tests
sonar.test.inclusions=core/src/test/**,app/src/test/**,app/src/androidTest/**,tests/**
sonar.exclusions=**/build/**,**/.gradle/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.webp,**/*.ico,**/*.ttf,**/*.pdf,**/gradle/wrapper/**,core/src/test/**,app/src/test/**,app/src/androidTest/**,tests/**

# Executed Kotlin core and Android debug JVM test coverage.
sonar.coverage.jacoco.xmlReportPaths=core/build/reports/jacoco/test/jacocoTestReport.xml,app/build/reports/coverage/test/debug/report.xml
# Resolve executed reports relative to the app and core scanner modules.
app.sonar.coverage.jacoco.xmlReportPaths=build/reports/coverage/test/debug/report.xml
core.sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
sonar.androidLint.reportPaths=app/build/reports/lint-results-debug.xml
app.sonar.androidLint.reportPaths=build/reports/lint-results-debug.xml

# Measure Python security-gate code, not just Kotlin core. The report uses
# [run] relative_files=True so Sonar resolves tools/check_mobsf_findings.py.
sonar.python.version=3.12
sonar.python.coverage.reportPaths=python-coverage.xml
