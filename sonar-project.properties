# SonarQube Cloud mainline bootstrap for aimindseye/sablehealth.
# Project and SONAR_TOKEN were configured by the repository owner.
# Mainline baseline must be analyzed before interpreting PR new-code coverage.
sonar.projectKey=aimindseye_sablehealth
sonar.organization=aimindseye
sonar.projectName=Sable Health
sonar.sourceEncoding=UTF-8

# No blanket source exclusion. SonarCloud's analysis-scope UX may disregard
# sonar.sources / sonar.tests; leave file classification to project settings.
sonar.exclusions=**/build/**,**/.gradle/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.webp,**/*.ico,**/*.ttf,**/*.pdf,**/gradle/wrapper/**

# Real executed :core:test coverage. Android/Compose UI coverage is not claimed.
sonar.coverage.jacoco.xmlReportPaths=core/build/reports/jacoco/test/jacocoTestReport.xml
sonar.androidLint.reportPaths=app/build/reports/lint-results-debug.xml
